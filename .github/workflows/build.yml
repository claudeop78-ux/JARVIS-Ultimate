
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Extract JARVIS project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || { echo "JARVIS ZIP not found"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find and build Android project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          test -n "$GRADLEW" || { echo "gradlew not found in ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          find project -type f -path '*/app/build/outputs/apk/debug/*.apk' -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Ultimate-APK
          path: output/*.apk
          if-no-files-found: error
